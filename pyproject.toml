[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marshall-heartbit"
version = "0.1.0"
description = "Keep a Marshall BLE speaker awake with a periodic volume write"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["bleak>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
marshall-heartbit = "marshall_heartbit:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
